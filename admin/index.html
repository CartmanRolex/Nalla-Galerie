<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="robots" content="noindex" />
    <title>Administration · Galerie Weurseuk</title>
    <style>
      /* Correctifs pour Safari iOS. L'interface de Decap CMS est conçue
         pour le bureau ; ces règles corrigent les défauts les plus visibles
         sur iPhone sans toucher au rendu sur ordinateur. */

      /* 1. Sur iOS, 100vh inclut les barres du navigateur : le bas de
            l'interface passe sous la barre d'outils et devient inatteignable. */
      html, body {
        height: 100%;
        height: -webkit-fill-available;
        margin: 0;
      }
      #nc-root {
        min-height: -webkit-fill-available;
      }

      /* 2. Safari zoome automatiquement quand un champ fait moins de 16px,
            ce qui décale toute la mise en page et ne se remet pas droit. */
      input, textarea, select, [contenteditable="true"] {
        font-size: 16px !important;
      }

      /* 3. Empêche l'agrandissement automatique du texte en paysage. */
      html {
        -webkit-text-size-adjust: 100%;
      }

      /* 4. Respecte l'encoche et la barre d'accueil des iPhone récents. */
      body {
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        padding-bottom: env(safe-area-inset-bottom);
      }

      /* Ne rien ajouter ici qui vise les classes internes de Decap CMS :
         elles sont générées et changent d'une version à l'autre. Une tentative
         de réagencer l'éditeur par ce biais a vidé le formulaire sur Android. */
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>
  </body>
</html>
