# Connexion via DecapBridge (PKCE) — bloc généré par DecapBridge.
# Ne pas modifier à la main : le régénérer depuis le tableau de bord
# DecapBridge si le site y est recréé.
backend:
  name: git-gateway
  repo: CartmanRolex/Nalla-Galerie
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/4f66a9c6-5242-4d3d-baa9-9b714a44501c/pkce
  auth_token_endpoint: /sites/4f66a9c6-5242-4d3d-baa9-9b714a44501c/token
  gateway_url: https://gateway.decapbridge.com

  # Chaque enregistrement est signé du nom de son auteur.
  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} “{{slug}}” - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete “{{path}}” - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Lien « voir le site » dans l'éditeur.
site_url: https://cartmanrolex.github.io/Nalla-Galerie/

# Les photos déposées dans l'éditeur atterrissent ici.
media_folder: images
public_folder: images

locale: fr

collections:
  - name: reglages
    label: Réglages du site
    files:
      - name: site
        label: Identité et coordonnées
        file: site.json
        format: json
        fields:
          - { label: Nom du site, name: name, widget: string }
          - { label: Ville ou quartier, name: location, widget: string, required: false }
          - { label: Pays, name: country, widget: string, required: false }
          - { label: Téléphone, name: phone, widget: string, required: false }
          - { label: Email, name: email, widget: string, required: false }
          - label: Numéro WhatsApp
            name: whatsapp
            widget: string
            required: false
            hint: Chiffres uniquement avec l'indicatif du pays, par exemple 221776817715.

  - name: artistes
    label: Artistes
    files:
      - name: artists
        label: Fiches artistes
        file: artists.json
        format: json
        description: Les pages artistes du site.
        fields:
          - { label: Page Artistes — petit titre, name: eyebrow, widget: string, required: false }
          - { label: Page Artistes — titre, name: page_title, widget: string }
          - { label: Page Artistes — introduction, name: page_intro, widget: text, required: false }
          - label: Artistes
            name: artists
            widget: list
            label_singular: Artiste
            summary: '{{fields.name}}'
            fields:
              - label: Nom
                name: name
                widget: string
              - label: Sous-titre
                name: role
                widget: string
                hint: Affiché au-dessus du nom, par exemple « Artiste visuel · Sénégal ».
              - label: Discipline et ville
                name: discipline
                widget: string
                required: false
                hint: Affiché sur la page Artistes, par exemple « Peinture, gravure · Ngor, Dakar ».
              - label: Lieu et pays
                name: location
                widget: string
                required: false
                hint: Affiché dans la section contact, par exemple « Ngor, Dakar — Sénégal ».
              - label: Présentation
                name: intro
                widget: text
                required: false
              - label: Portrait
                name: portrait
                widget: image
                required: false
              - label: Description du portrait
                name: portrait_alt
                widget: string
                required: false
                hint: Pour les personnes qui ne voient pas l'image.
              - label: Crédit photo
                name: portrait_credit
                widget: string
                required: false
              - label: Encart — étiquette
                name: highlight_tag
                widget: string
                required: false
                hint: Laisser vide pour masquer l'encart doré.
              - label: Encart — texte
                name: highlight_text
                widget: text
                required: false
                hint: Les balises <em>…</em> mettent en italique.
              - label: Titre du texte d'intention
                name: statement_title
                widget: string
                required: false
                default: Note d'intention
              - label: Texte d'intention
                name: statement
                widget: text
                required: false
              - label: Expositions
                name: exhibitions
                widget: list
                required: false
                label_singular: Année
                summary: '{{fields.year}}'
                fields:
                  - label: Année
                    name: year
                    widget: string
                  - label: Lignes
                    name: items
                    widget: list
                    field:
                      label: Exposition
                      name: item
                      widget: string
              - label: Téléphone
                name: phone
                widget: string
                required: false
                hint: Sert aussi au lien WhatsApp.
              - label: Email
                name: email
                widget: string
                required: false

  - name: catalogue
    label: Catalogue
    files:
      - name: works
        label: Œuvres
        file: works.json
        format: json
        description: Les toiles affichées sur la page Œuvres du site.
        fields:
          - { label: Page Œuvres — petit titre, name: eyebrow, widget: string, required: false }
          - { label: Page Œuvres — titre, name: page_title, widget: string }
          - { label: Page Œuvres — introduction, name: page_intro, widget: text, required: false }
          - { label: Contact — titre, name: contact_title, widget: string, required: false }
          - { label: Contact — texte, name: contact_text, widget: text, required: false }
          - label: Séries
            name: series
            widget: list
            label_singular: Série
            summary: '{{fields.name}}'
            fields:
              - label: Nom de la série
                name: name
                widget: string
                hint: Affiché en titre, par exemple « Braises ».
              - label: Œuvres
                name: works
                widget: list
                label_singular: Œuvre
                summary: '{{fields.title}}'
                fields:
                  - label: Titre
                    name: title
                    widget: string
                  - label: Artiste
                    name: artist
                    widget: string
                    default: Nalla Thioye
                  - label: Technique
                    name: medium
                    widget: string
                    default: Acrylique sur toile
                    hint: Par exemple « Huile sur toile ».
                  - label: Photo
                    name: image
                    widget: image
                  - label: Description courte de l'image
                    name: alt
                    widget: string
                    required: false
                    hint: Pour les personnes qui ne voient pas l'image.
                  - label: Description
                    name: description
                    widget: text
                    required: false
                    hint: Texte affiché quand on clique sur l'œuvre.
                  - { label: Dimensions, name: dimensions, widget: string, required: false }
                  - { label: Année, name: year, widget: string, required: false }
                  - { label: Prix, name: price, widget: string, required: false, hint: Laisser vide pour ne rien afficher. }
                  - label: Disponibilité
                    name: availability
                    widget: select
                    required: false
                    options: [Disponible, Réservée, Vendue]
                  - { label: Référence, name: reference, widget: string, required: false }

  - name: pages
    label: Pages
    files:
      - name: homepage
        label: Accueil
        file: homepage.json
        format: json
        fields:
          - { label: Grande image, name: hero_image, widget: image }
          - { label: Description de l'image, name: hero_alt, widget: string, required: false }
          - { label: Petit titre, name: eyebrow, widget: string, required: false }
          - { label: Titre principal, name: title, widget: string }
          - { label: Partie du titre en italique, name: title_emphasis, widget: string, required: false }
          - { label: Introduction, name: intro, widget: text, required: false }
          - { label: Premier bouton — texte, name: primary_label, widget: string, required: false }
          - { label: Premier bouton — lien, name: primary_url, widget: string, required: false }
          - { label: Deuxième bouton — texte, name: secondary_label, widget: string, required: false }
          - { label: Deuxième bouton — lien, name: secondary_url, widget: string, required: false }
          - { label: Bloc rencontre — titre, name: meeting_title, widget: string, required: false }
          - { label: Bloc rencontre — texte, name: meeting_text, widget: text, required: false }
          - { label: Bloc rencontre — bouton, name: meeting_label, widget: string, required: false }
          - { label: Bloc rencontre — lien, name: meeting_url, widget: string, required: false }
          - { label: Titre des séries mises en avant, name: featured_label, widget: string, required: false }
      - name: gallery
        label: La galerie
        file: gallery.json
        format: json
        fields:
          - { label: Petit titre, name: eyebrow, widget: string, required: false }
          - { label: Titre principal, name: title, widget: string }
          - { label: Introduction, name: intro, widget: text, required: false }
          - label: Blocs de contenu
            name: sections
            widget: list
            required: false
            label_singular: Bloc
            summary: '{{fields.title}}'
            fields:
              - { label: Titre, name: title, widget: string }
              - { label: Texte, name: text, widget: text, required: false }
              - { label: Bouton — texte, name: button_label, widget: string, required: false }
              - { label: Bouton — lien, name: button_url, widget: string, required: false }
          - { label: Contact — titre, name: contact_title, widget: string, required: false }
          - { label: Contact — texte, name: contact_text, widget: text, required: false }
          - { label: WhatsApp — texte du lien, name: whatsapp_label, widget: string, required: false }
      - name: atelier
        label: Atelier
        file: atelier.json
        format: json
        fields: &editorial_page_fields
          - label: Petit titre
            name: eyebrow
            widget: string
            required: false
          - label: Titre principal
            name: title
            widget: string
          - label: Introduction
            name: intro
            widget: text
            required: false
          - label: Blocs de contenu
            name: sections
            widget: list
            required: false
            label_singular: Bloc
            summary: '{{fields.title}}'
            fields:
              - label: Titre
                name: title
                widget: string
              - label: Texte
                name: text
                widget: text
                required: false
              - label: Image
                name: image
                widget: image
                required: false
              - label: Description de l'image
                name: image_alt
                widget: string
                required: false
              - label: Légende
                name: caption
                widget: string
                required: false
          - label: Galerie photos
            name: gallery
            widget: list
            required: false
            label_singular: Photo
            summary: '{{fields.caption}}'
            fields:
              - label: Image
                name: image
                widget: image
              - label: Description de l'image
                name: alt
                widget: string
                required: false
              - label: Légende
                name: caption
                widget: string
                required: false
          - label: Appel à l'action — titre
            name: cta_title
            widget: string
            required: false
          - label: Appel à l'action — texte
            name: cta_text
            widget: text
            required: false
          - label: Bouton — libellé
            name: cta_label
            widget: string
            required: false
          - label: Bouton — lien
            name: cta_url
            widget: string
            required: false
            hint: Par exemple « mailto:adresse@email.com », « https://wa.me/... » ou « artistes.html ».
      - name: customisation
        label: Customisation de vêtements
        file: customisation.json
        format: json
        fields: *editorial_page_fields
